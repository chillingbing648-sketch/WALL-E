        <rect width="128" height="72" rx="12" fill="#f59e0b" fill-opacity=".105" stroke="#fbbf24" stroke-opacity=".5"/>
        <circle cx="64" cy="26" r="15" fill="#f59e0b" fill-opacity=".2"/><text x="64" y="31" text-anchor="middle" font-size="17">☺</text>
        <text x="64" y="56" text-anchor="middle" class="title ui" font-size="11" font-weight="600">Happy</text>
      </g>
      <g transform="translate(140)">
        <rect width="128" height="72" rx="12" fill="#10b981" fill-opacity=".06" stroke="#6ee7b7" stroke-opacity=".22"/>
        <circle cx="64" cy="26" r="15" fill="#10b981" fill-opacity=".15"/><text x="64" y="31" text-anchor="middle" font-size="17">◡</text>
        <text x="64" y="56" text-anchor="middle" class="title ui" font-size="11">Calm</text>
      </g>
      <g transform="translate(280)">
        <rect width="128" height="72" rx="12" fill="#94a3b8" fill-opacity=".06" stroke="#94a3b8" stroke-opacity=".2"/>
        <circle cx="64" cy="26" r="15" fill="#94a3b8" fill-opacity=".15"/><text x="64" y="31" text-anchor="middle" font-size="17">—</text>
        <text x="64" y="56" text-anchor="middle" class="title ui" font-size="11">Neutral</text>
      </g>
      <g transform="translate(420)">
        <rect width="128" height="72" rx="12" fill="#818cf8" fill-opacity=".06" stroke="#818cf8" stroke-opacity=".2"/>
        <circle cx="64" cy="26" r="15" fill="#818cf8" fill-opacity=".15"/><text x="64" y="31" text-anchor="middle" font-size="17">⌁</text>
        <text x="64" y="56" text-anchor="middle" class="title ui" font-size="11">Stressed</text>
      </g>
      <g transform="translate(560)">
        <rect width="128" height="72" rx="12" fill="#a5b4fc" fill-opacity=".06" stroke="#a5b4fc" stroke-opacity=".2"/>
        <circle cx="64" cy="26" r="15" fill="#a5b4fc" fill-opacity=".15"/><text x="64" y="31" text-anchor="middle" font-size="17">☹</text>
        <text x="64" y="56" text-anchor="middle" class="title ui" font-size="11">Sad</text>
      </g>
    </g>
    <!-- chart panel -->
