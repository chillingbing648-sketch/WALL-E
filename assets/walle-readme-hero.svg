    <text x="0" y="111" class="copy" font-size="12">Notice how you feel. Celebrate what you do. Make room to reset.</text>
    <!-- mood panel -->
    <rect x="0" y="137" width="745" height="140" rx="17" class="panel"/>
    <text x="20" y="164" class="title ui" font-size="13" font-weight="700">How are you feeling?</text>
    <text x="724" y="164" class="copy" text-anchor="end" font-size="10">CHECK IN WITH YOURSELF</text>
    <g transform="translate(21 184)">
