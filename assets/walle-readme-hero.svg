      <path d="M48 365V505M122 365V505M196 365V505M270 365V505M344 365V505M418 365V505"/>
    </g>
    <path d="M28 463 C60 440 75 448 101 426 S148 448 175 411 S224 431 250 399 S300 421 327 385 S375 405 429 374" fill="none" stroke="#8b80ff" stroke-width="3" stroke-linecap="round"/>
    <path d="M28 463 C60 440 75 448 101 426 S148 448 175 411 S224 431 250 399 S300 421 327 385 S375 405 429 374 L429 505 L28 505Z" fill="url(#violet)" opacity=".11"/>
    <g fill="#c6c0ff" stroke="#171a32" stroke-width="3"><circle cx="28" cy="463" r="5"/><circle cx="101" cy="426" r="5"/><circle cx="175" cy="411" r="5"/><circle cx="250" cy="399" r="5"/><circle cx="327" cy="385" r="5"/><circle cx="429" cy="374" r="5"/></g>
    <g class="copy" font-size="9" text-anchor="middle"><text x="48" y="519">MON</text><text x="122" y="519">TUE</text><text x="196" y="519">WED</text><text x="270" y="519">THU</text><text x="344" y="519">FRI</text><text x="418" y="519">SAT</text></g>
    <!-- wellness score panel -->
    <rect x="475" y="293" width="270" height="235" rx="17" class="panel"/>
    <text x="495" y="321" class="title ui" font-size="13" font-weight="700">Harmony balance</text>
    <text x="495" y="340" class="copy" font-size="10">A reflection of your activity</text>
    <circle cx="610" cy="420" r="59" fill="none" stroke="#e1e7ff" stroke-opacity=".07" stroke-width="10"/>
    <circle cx="610" cy="420" r="59" fill="none" stroke="url(#warm)" stroke-width="10" stroke-linecap="round" stroke-dasharray="255 371" transform="rotate(-90 610 420)"/>
    <text x="610" y="417" text-anchor="middle" class="title ui" font-size="27" font-weight="700">78%</text>
    <text x="610" y="438" text-anchor="middle" class="copy" font-size="9">ILLUSTRATIVE</text>
    <text x="495" y="503" class="copy" font-size="10">Mood · Habits · Journal</text>
    <!-- bottom cards -->
    <rect x="0" y="544" width="460" height="170" rx="17" class="panel"/>
    <text x="20" y="573" class="title ui" font-size="13" font-weight="700">Today's gentle momentum</text>
    <text x="20" y="592" class="copy" font-size="10">Small routines, practiced with kindness.</text>
    <g transform="translate(20 610)">
      <circle cx="11" cy="11" r="10" fill="#10b981" fill-opacity=".18" stroke="#6ee7b7" stroke-opacity=".6"/><path d="M6 11l3 3 7-7" stroke="#6ee7b7" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <text x="31" y="15" class="title ui" font-size="11">Morning stretch</text><text x="420" y="15" class="copy" font-size="10" text-anchor="end">COMPLETED</text>
      <path d="M0 29H420" stroke="#fff" stroke-opacity=".06"/>
      <circle cx="11" cy="49" r="10" fill="#fff" fill-opacity=".035" stroke="#fff" stroke-opacity=".16"/>
      <text x="31" y="53" class="title ui" font-size="11">Read for ten minutes</text><text x="420" y="53" class="copy" font-size="10" text-anchor="end">NEXT STEP</text>
    </g>
    <rect x="475" y="544" width="270" height="170" rx="17" fill="#141c2e" stroke="#dce5ff" stroke-opacity=".095"/>
    <circle cx="610" cy="635" r="72" fill="url(#glow)"/>
    <g transform="translate(564 574)">
      <path d="M46 94V52" stroke="#6ee7b7" stroke-width="3" stroke-linecap="round"/>
      <path d="M46 67C16 66 17 37 17 37C39 36 50 49 46 67Z" fill="#10b981" fill-opacity=".8" stroke="#6ee7b7" stroke-opacity=".8"/>
      <path d="M46 54C44 27 70 21 70 21C73 42 60 54 46 54Z" fill="#34d399" fill-opacity=".85" stroke="#6ee7b7" stroke-opacity=".7"/>
      <path d="M26 95H66" stroke="#d1b47c" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="610" y="686" text-anchor="middle" class="title ui" font-size="12" font-weight="700">Memory Garden</text>
    <text x="610" y="702" text-anchor="middle" class="copy" font-size="9">Small wins, taking root</text>
  </g>
</svg>