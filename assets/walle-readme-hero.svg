<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="880" viewBox="0 0 1500 880" role="img" aria-labelledby="title desc">
  <title id="title">WALL·E wellness workspace overview</title>
  <desc id="desc">A concept illustration of WALL·E's dark, calming wellness dashboard with mood tracking, a seven-day mood chart, a harmony balance score, healthy habits, and a small glowing memory garden.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b0f1a"/><stop offset=".55" stop-color="#10182a"/><stop offset="1" stop-color="#171a32"/></linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbbf24"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#6d5ce8"/><stop offset="1" stop-color="#9a8bff"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#f59e0b" stop-opacity=".22"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="35"/></filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#b9c8ff" stroke-opacity=".055" stroke-width="1"/></pattern>
    <style>
      .ui{font-family:'Plus Jakarta Sans',Inter,system-ui,sans-serif}
      .serif{font-family:'Playfair Display',Georgia,serif}
      .label{font-size:10px;letter-spacing:1.6px;font-weight:700}
      .copy{fill:#9aa8c4;font-family:'Plus Jakarta Sans',Inter,system-ui,sans-serif}
      .title{fill:#f4f6fc;font-family:'Plus Jakarta Sans',Inter,system-ui,sans-serif}
      .panel{fill:#111a2c;fill-opacity:.92;stroke:#dce5ff;stroke-opacity:.095}
    </style>
  </defs>
  <rect width="1500" height="880" rx="28" fill="#080c15"/>
  <rect x="12" y="12" width="1476" height="856" rx="22" fill="url(#bg)" stroke="#e4e9ff" stroke-opacity=".12"/>
  <rect x="12" y="12" width="1476" height="856" rx="22" fill="url(#grid)"/>
  <circle cx="1170" cy="150" r="190" fill="url(#glow)" filter="url(#blur)"/>
  <circle cx="220" cy="780" r="220" fill="#4f46e5" opacity=".08" filter="url(#blur)"/>
  <!-- top chrome -->
  <g transform="translate(42 36)">
    <rect x="0" y="0" width="38" height="38" rx="12" fill="#f59e0b" fill-opacity=".14" stroke="#fbbf24" stroke-opacity=".35"/>
    <path d="M19 28V17M19 21C10 21 9 12 9 12C18 11 20 17 19 21ZM19 17C20 8 28 8 29 8C29 16 23 19 19 17Z" fill="none" stroke="#fbbf24" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="50" y="17" class="title ui" font-size="15" font-weight="800" letter-spacing="2">WALL·E</text>
    <text x="50" y="32" class="copy" font-size="9" letter-spacing="1.5">YOUR WELLNESS SPACE</text>
    <text x="1390" y="16" text-anchor="end" class="copy label">A SMALL SPACE TO RESET</text>
    <circle cx="1379" cy="30" r="3" fill="#10b981"/><text x="1390" y="34" class="copy" font-size="10" text-anchor="end">LOCAL WORKSPACE</text>
  </g>
  <path d="M42 91H1458" stroke="#fff" stroke-opacity=".09"/>
  <!-- sidebar -->
  <g transform="translate(34 112)">
    <rect width="212" height="724" rx="18" class="panel"/>
    <g transform="translate(18 22)">
      <circle cx="18" cy="18" r="18" fill="#f59e0b" fill-opacity=".14"/>
      <circle cx="13" cy="16" r="6" fill="#24334a" stroke="#fbbf24" stroke-width="1.4"/>
      <circle cx="24" cy="16" r="6" fill="#24334a" stroke="#fbbf24" stroke-width="1.4"/>
      <circle cx="13" cy="16" r="2.2" fill="#fbbf24"/><circle cx="24" cy="16" r="2.2" fill="#fbbf24"/>
      <text x="48" y="16" class="title ui" font-size="12" font-weight="700">Your sanctuary</text>
      <text x="48" y="31" class="copy" font-size="9">One day at a time</text>
    </g>
    <g class="ui" font-size="12">
      <rect x="12" y="86" width="188" height="38" rx="11" fill="#4f46e5" fill-opacity=".18" stroke="#9387ff" stroke-opacity=".25"/>
      <circle cx="31" cy="105" r="5" fill="#a99cff"/><text x="46" y="109" fill="#f3f2ff" font-weight="600">Home</text>
      <circle cx="31" cy="151" r="5" fill="#fbbf24" fill-opacity=".8"/><text x="46" y="155" class="copy">Mood tracker</text>
      <circle cx="31" cy="197" r="5" fill="#9eb7ff" fill-opacity=".8"/><text x="46" y="201" class="copy">Journal</text>
      <circle cx="31" cy="243" r="5" fill="#6fd7be" fill-opacity=".8"/><text x="46" y="247" class="copy">Habits</text>
      <circle cx="31" cy="289" r="5" fill="#c0b5ff" fill-opacity=".8"/><text x="46" y="293" class="copy">Mood boost</text>
      <circle cx="31" cy="335" r="5" fill="#7fdaad" fill-opacity=".8"/><text x="46" y="339" class="copy">Memory garden</text>
      <circle cx="31" cy="381" r="5" fill="#84c7ff" fill-opacity=".8"/><text x="46" y="385" class="copy">Zen station</text>
      <circle cx="31" cy="427" r="5" fill="#fbbf24" fill-opacity=".8"/><text x="46" y="431" class="copy">Wellness report</text>
    </g>
    <path d="M16 482H196" stroke="#fff" stroke-opacity=".08"/>
    <text x="18" y="509" class="copy label" font-size="8">YOUR PACE MATTERS</text>
    <text x="18" y="540" class="serif" fill="#f5d9a4" font-size="17" font-style="italic">Small steps.</text>
    <text x="18" y="562" class="serif" fill="#f5d9a4" font-size="17" font-style="italic">Real growth.</text>
    <g transform="translate(18 610)">
      <circle cx="15" cy="14" r="14" fill="#10b981" fill-opacity=".12"/>
      <path d="M15 23V13M15 17C8 17 8 10 8 10C14 9 16 13 15 17ZM15 13C15 7 21 6 22 6C22 12 18 15 15 13Z" fill="none" stroke="#6ee7b7" stroke-width="1.4" stroke-linecap="round"/>
      <text x="39" y="13" class="title ui" font-size="10" font-weight="600">A quiet reminder</text>
      <text x="39" y="28" class="copy" font-size="9">You can begin again.</text>
    </g>
